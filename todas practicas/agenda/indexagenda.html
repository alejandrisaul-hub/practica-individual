<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Semanal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #121216;
            --border-color: #2a2a35;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            padding: 2rem; 
        }

        .card-custom { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .btn-custom-primary {
            background-color: var(--accent-color);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-custom-primary:hover {
            background-color: var(--accent-hover);
            color: white;
        }

        .table-custom {
            background-color: #121216 !important;
            color: #ffffff;
            border-color: var(--border-color);
        }

        .table-custom th, .table-custom td {
            background-color: #121216 !important;
            color: #ffffff !important;
            border-color: var(--border-color);
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container my-4">
        <div class="card card-custom p-4 p-md-5 mb-4">
            <h2 class="mb-3 fw-bold text-white">Agenda Semanal</h2>
            <p class="text-light mb-4 opacity-75">Haz clic en el botón para registrar los eventos de la semana mediante ventanas emergentes.</p>
            
            <button class="btn btn-custom-primary w-100 py-3 fs-6" onclick="guardar()">Capturar Evento</button>
        </div>

        <div class="card card-custom p-4 p-md-5">
            <h4 class="mb-3 fw-semibold text-white">Registros de la Agenda</h4>
            <div class="table-responsive">
                <table class="table table-custom table-bordered align-middle">
                    <thead>
                        <tr>
                            <th>Día</th>
                            <th>Hr</th>
                            <th>Evento</th>
                            <th>Desc</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Lunes</td>
                            <td id="hr0"></td>
                            <td id="evento0"></td>
                            <td id="desc0"></td>
                        </tr>
                        <tr>
                            <td>Martes</td>
                            <td id="hr1"></td>
                            <td id="evento1"></td>
                            <td id="desc1"></td>
                        </tr>
                        <tr>
                            <td>Miércoles</td>
                            <td id="hr2"></td>
                            <td id="evento2"></td>
                            <td id="desc2"></td>
                        </tr>
                        <tr>
                            <td>Jueves</td>
                            <td id="hr3"></td>
                            <td id="evento3"></td>
                            <td id="desc3"></td>
                        </tr>
                        <tr>
                            <td>Viernes</td>
                            <td id="hr4"></td>
                            <td id="evento4"></td>
                            <td id="desc4"></td>
                        </tr>
                        <tr>
                            <td>Sábado</td>
                            <td id="hr5"></td>
                            <td id="evento5"></td>
                            <td id="desc5"></td>
                        </tr>
                        <tr>
                            <td>Domingo</td>
                            <td id="hr6"></td>
                            <td id="evento6"></td>
                            <td id="desc6"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="jss/agenda.js"></script>
</body>
</html>
