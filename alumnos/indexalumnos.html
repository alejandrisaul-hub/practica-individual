<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 3: Alumnos con Prompt</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #121216;
            --border-color: #2a2a35;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            padding: 2rem; 
        }

        .card-custom { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .btn-custom-primary {
            background-color: var(--accent-color);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-custom-primary:hover {
            background-color: var(--accent-hover);
            color: white;
        }

        .box-resultado { 
            background-color: #09090b; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            padding: 1.25rem; 
            color: #c4b5fd; 
            font-family: monospace; 
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card card-custom p-4 p-md-5">
            <h2 class="mb-2 fw-bold text-white">Gestión de 10 Alumnos (Prompt)</h2>
            <p class="text-light mb-4 opacity-75">dale clik para capturar a los alumnos y despues eliminarlo jejejej.</p>
            
            <div class="mb-4">
                <button class="btn btn-custom-primary w-100 py-3 fs-6" onclick="capturarYProcesarAlumnos()">Iniciar Captura de Alumnos</button>
            </div>
            
            <!-- Caja de resultados -->
            <div class="box-resultado" id="resultadoAlumnos">
                Haz click
            </div>
        </div>
    </div>

   
    <script src="js/alumnos.js"></script>
</body>
</html>
